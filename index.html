<!doctype html>
<html lang="zh-CN" class="scheme-light dark:scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>哈吉米统计</title>
    <script>
      try {
        var mode = localStorage.getItem("agy_theme_mode") || "system";
        var rawPreset = localStorage.getItem("agy_theme_preset") || "classic";
        var legacyMap = {
          indigo: "linear",
          ocean: "tokyo",
          emerald: "terminal",
          violet: "stripe",
          amber: "claude",
          rose: "claude"
        };
        var validPresets = { classic: 1, mono: 1, linear: 1, claude: 1, stripe: 1, terminal: 1, tokyo: 1 };
        var preset = validPresets[rawPreset] ? rawPreset : (legacyMap[rawPreset] || "classic");
        var isDark =
          mode === "dark" ||
          (mode !== "light" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", Boolean(isDark));
        document.documentElement.dataset.theme = preset;
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      } catch (_) {}
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
