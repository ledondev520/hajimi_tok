<!doctype html>
<html lang="zh-CN" class="scheme-light dark:scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>哈吉米统计</title>
    <script>
      try {
        if (localStorage.getItem("agy_theme_mode") === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (_) {}
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500/20 dark:bg-slate-950 dark:text-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
